<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${acao} + ' Produto - Mercado Express'">Formulário de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5 main-content">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Início</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/produtos}" class="text-decoration-none">Produtos</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${acao} + ' Produto'">Ação</li>
                    </ol>
                </nav>

                <div class="card card-custom p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="bg-success-subtle p-3 rounded-circle text-success fs-3">
                            <i th:class="${acao == 'Cadastrar' ? 'bi bi-plus-circle' : 'bi bi-pencil-square'}"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${acao} + ' Produto'">Cadastrar Produto</h3>
                            <p class="text-muted small mb-0">Preencha os campos abaixo para persistir no banco de dados.</p>
                        </div>
                    </div>

                    <form th:action="${produto.id == null ? '/produtos/salvar' : '/produtos/atualizar/' + produto.id}"
                          th:object="${produto}" method="post" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-bold">Nome do Produto <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       placeholder="Ex: Sabão em Pó Omo, Maçã Fuji, Meia Lupo..." required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                                    Erro no nome.
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="tipo" class="form-label fw-bold">Tipo / Categoria <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-bookmarks"></i></span>
                                    <input type="text" class="form-control" id="tipo" th:field="*{tipo}" list="opcoesTipo"
                                           th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'"
                                           placeholder="Ex: Produto de Limpeza, Fruta..." required>
                                    <datalist id="opcoesTipo">
                                        <option value="Produto de Limpeza">
                                        <option value="Hortifruti">
                                        <option value="Vestuário">
                                        <option value="Brinquedo">
                                        <option value="Bebidas">
                                        <option value="Mercearia">
                                    </datalist>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">
                                        Erro no tipo.
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="setor" class="form-label fw-bold">Setor no Mercado <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" class="form-control" id="setor" th:field="*{setor}" list="opcoesSetor"
                                           th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'"
                                           placeholder="Ex: Limpeza, Hortifruti, Meias..." required>
                                    <datalist id="opcoesSetor">
                                        <option value="Limpeza">
                                        <option value="Frutas e Verduras">
                                        <option value="Meias e Acessórios">
                                        <option value="Brinquedos">
                                        <option value="Bebidas">
                                        <option value="Padaria e Frios">
                                    </datalist>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}">
                                        Erro no setor.
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="tamanho" class="form-label fw-bold">Tamanho / Embalagem</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-aspect-ratio"></i></span>
                                    <input type="text" class="form-control" id="tamanho" th:field="*{tamanho}" 
                                           placeholder="Ex: 1kg, 500ml, 38-42">
                                </div>
                                <small class="text-muted">Opcional (peso, volume ou numeração).</small>
                            </div>

                            <div class="col-md-4">
                                <label for="preco" class="form-label fw-bold">Preço Unitário (R$) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" step="0.01" min="0.01" class="form-control" id="preco" th:field="*{preco}" 
                                           th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'"
                                           placeholder="0,00" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">
                                        Erro no preço.
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="estoque" class="form-label fw-bold">Quantidade em Estoque</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-boxes"></i></span>
                                    <input type="number" min="0" class="form-control" id="estoque" th:field="*{estoque}" 
                                           placeholder="50">
                                </div>
                                <small class="text-muted">Controle para o Dashboard Gerencial.</small>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/produtos}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary-custom px-4">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${acao} + ' Produto'">Salvar</span>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
