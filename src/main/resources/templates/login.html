<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center p-3">

    <div class="card card-custom p-4 p-md-5 bg-white" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success p-3 rounded-circle mb-3">
                <i class="bi bi-cart4 fs-1"></i>
            </div>
            <h3 class="fw-bold mb-1">Mercado <span class="text-success">Express</span></h3>
            <p class="text-muted small mb-0">Autenticação de Usuários</p>
        </div>

        <div th:if="${erroMensagem}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${erroMensagem}">Usuário ou senha inválidos.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${sucessoMensagem}" class="alert alert-success alert-dismissible fade show small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${sucessoMensagem}">Desconectado com sucesso.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold small">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold small">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
            </button>

            <div class="text-center my-3">
                <span class="text-muted small">Não possui uma conta?</span>
                <a th:href="@{/registro}" class="text-decoration-none fw-bold small text-success ms-1">
                    <i class="bi bi-person-plus-fill me-1"></i>Cadastre-se (Sign Up)
                </a>
            </div>

            <a th:href="@{/}" class="btn btn-outline-secondary w-100 py-2 small">
                <i class="bi bi-arrow-left me-1"></i> Voltar à Página Inicial
            </a>
        </form>

        <div class="mt-4 p-3 bg-light rounded border text-center small text-muted">
            <span class="fw-bold d-block text-dark mb-1"><i class="bi bi-info-circle text-primary me-1"></i>Credenciais de Teste:</span>
            <div><strong>Admin:</strong> <code>admin</code> / <code>admin123</code> <span class="badge bg-danger">Total</span></div>
            <div><strong>Usuário:</strong> <code>usuario</code> / <code>user123</code> <span class="badge bg-info text-dark">Cadastro</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
