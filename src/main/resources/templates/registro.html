<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro (Sign Up) - Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center p-3">

    <div class="card card-custom p-4 p-md-5 bg-white shadow-sm" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success p-3 rounded-circle mb-3">
                <i class="bi bi-person-plus-fill fs-1"></i>
            </div>
            <h3 class="fw-bold mb-1">Criar <span class="text-success">Conta</span></h3>
            <p class="text-muted small mb-0">Cadastre seu perfil na tabela <code>TDS_Users_Mercado</code></p>
        </div>

        <div th:if="${erroMensagem}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${erroMensagem}">Erro ao realizar cadastro.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/registro}" th:object="${usuarioDto}" method="post">
            <div class="mb-3">
                <label for="nomeCompleto" class="form-label fw-bold small">Nome Completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                    <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" class="form-control"
                           th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid' : ''"
                           placeholder="Ex: João da Silva" autofocus>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-bold small">Nome de Usuário (Login)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           placeholder="Ex: joao.silva">
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label fw-bold small">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="Senha">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="confirmarPassword" class="form-label fw-bold small">Confirmar Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid' : ''"
                               placeholder="Repita a senha">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label fw-bold small">Perfil de Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <select id="role" th:field="*{role}" class="form-select" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.descricao} + ' (' + ${r.name()} + ')'"></option>
                    </select>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-2 fw-bold">
                <i class="bi bi-check-circle me-1"></i> Salvar Perfil e Cadastrar
            </button>

            <div class="text-center my-3">
                <span class="text-muted small">Já possui uma conta?</span>
                <a th:href="@{/login}" class="text-decoration-none fw-bold small text-success ms-1">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Fazer Login
                </a>
            </div>

            <a th:href="@{/}" class="btn btn-outline-secondary w-100 py-2 small">
                <i class="bi bi-arrow-left me-1"></i> Voltar à Página Inicial
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
