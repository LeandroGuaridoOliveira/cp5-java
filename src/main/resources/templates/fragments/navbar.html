<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> Início
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/produtos}">
                        <i class="bi bi-box-seam me-1"></i> Catálogo de Produtos
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link text-warning" th:href="@{/produtos/novo}">
                        <i class="bi bi-plus-circle me-1"></i> Novo Produto
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link text-info" th:href="@{/area-restrita}">
                        <i class="bi bi-shield-lock me-1"></i> Área Restrita
                    </a>
                </li>
            </ul>

            <form class="d-flex me-lg-3 my-2 my-lg-0" th:action="@{/produtos}" method="get">
                <div class="input-group input-group-sm">
                    <input class="form-control" type="search" name="termo" th:value="${termo}" placeholder="Buscar produto..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/registro}" class="btn btn-outline-light btn-sm px-2">
                        <i class="bi bi-person-plus me-1"></i> Cadastrar
                    </a>
                    <a th:href="@{/login}" class="btn btn-outline-success btn-sm px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <div class="text-light small text-end d-none d-sm-block">
                        <div>
                            <i class="bi bi-person-circle text-success me-1"></i>
                            <span sec:authentication="name" class="fw-bold"></span>
                        </div>
                        <span class="badge bg-secondary" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                        <span class="badge bg-info text-dark" sec:authorize="hasRole('USER') and !hasRole('ADMIN')">USER</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Sair do sistema">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
