version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercado-express-postgres
    environment:
      POSTGRES_DB: mercado_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mercado-express-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Porta AMQP (Spring Boot)
      - "15672:15672" # Porta do Dashboard Web (RabbitMQ Management Monitor)
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: mercado-express-mailpit
    ports:
      - "1025:1025" # Porta SMTP para receber os e-mails do Spring Boot
      - "8025:8025" # Interface Web para visualizar os e-mails enviados
    restart: unless-stopped

volumes:
  postgres_data:
